services:
  receiver:
    build: .
    image: tcp-fault-proxy:latest
    environment:
      SERVICE: receiver
      RECEIVER_HOST: 0.0.0.0
      RECEIVER_TCP_PORT: "9100"
      RECEIVER_HTTP_PORT: "9101"
    ports:
      - "127.0.0.1:9100:9100"
      - "127.0.0.1:9101:9101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  proxy:
    image: tcp-fault-proxy:latest
    build: .
    depends_on:
      receiver:
        condition: service_healthy
    environment:
      SERVICE: proxy
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: "9000"
      PROXY_CONNECT_TIMEOUT: "5"
      TARGET_HOST: receiver
      TARGET_PORT: "9100"
    ports:
      # 9000: 故障转发 TCP 入口；8080: 控制 API / docs
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  sender:
    image: tcp-fault-proxy:latest
    build: .
    depends_on:
      proxy:
        condition: service_healthy
      receiver:
        condition: service_healthy
    environment:
      SERVICE: sender
      SENDER_TARGET_HOST: proxy
      SENDER_TARGET_PORT: "9000"
    ports:
      # 发送器自己的控制 API / docs
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
